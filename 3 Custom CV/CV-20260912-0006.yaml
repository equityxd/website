    Profile:
    - name: 'Finance leader with 15+ years leading accounting, financial-close and
        ERP replacement mandates for multi-entity, multi-country organisations (BE,
        FR, NL). My expertise lands on the JD''s core needs: Erp, Financiers, Processus.
        I specialise in General Accounting (GL, AP, AR), Business Blueprint sign-off,
        workshops with stakeholders, and guiding ERP transformations from AS-IS diagnosis
        to go-live. General Accounting (GL, AP, AR) and financial-close leadership,
        and in guiding ERP replacements from AS-IS diagnosis to SAP S/4HANA go-live.
        What sets me apart is perspective: I''ve sat on both the operator''s and the
        executive-recruiter''s side of the table, so I read the numbers and the organisation
        behind them. I bring calm under pressure, rigorous Power BI / Cognos reporting,
        and a genuine commitment to turning finance into a lever for growth.'
